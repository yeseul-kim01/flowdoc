name: ✨ Feature / Idea
description: 새 기능·시각화 뷰 제안 (한쪽 또는 양쪽).
title: "[feat] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: "후보 아이디어 목록은 `docs/ideas.md` 참고. 구현 후엔 반대편을 위해 🔁 Parity 이슈를 여는 걸 잊지 말 것."
  - type: textarea
    id: problem
    attributes:
      label: 무엇을 / 왜
      description: 어떤 뷰·기능이고, 백엔드 협업에 왜 도움이 되나.
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: 영향 범위
      options:
        - "Spring Boot 수집기 (kys)"
        - "FastAPI 수집기 (jch)"
        - "둘 다 (패리티 대상)"
        - "공유 스펙 (spec/) — 양측 합의 필요"
        - "공유 UI (ui/) — 양측 합의 필요"
    validations:
      required: true
  - type: input
    id: idea-ref
    attributes:
      label: 관련 ideas.md 항목 (있으면)
      placeholder: "예: A2 역방향 영향도, G2 에러 카탈로그 …"
  - type: textarea
    id: spec-impact
    attributes:
      label: 스펙에 추가가 필요한가?
      description: 기존 스키마로 표현되면 "필요 없음". 새 필드가 필요하면 무엇인지.
