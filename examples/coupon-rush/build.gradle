plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.5'
    id 'io.spring.dependency-management' version '1.1.6'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    runtimeOnly 'com.h2database:h2'

    // The only FlowDoc thing the app code touches: the declaration annotations.
    implementation 'io.flowdoc:flowdoc-annotations:0.1.0-SNAPSHOT'

    // Swagger-style live viewer at /flowdoc (serves the prebuilt spec on the classpath).
    implementation 'io.flowdoc:flowdoc-spring-boot-starter:0.1.0-SNAPSHOT'
}

tasks.named('test') {
    useJUnitPlatform()
}
