[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flowdoc-python"
version = "0.1.0"
description = "FlowDoc Python static scanner for FastAPI projects"
requires-python = ">=3.11"
dependencies = [
    "jsonschema==4.23.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.2",
    "pytest-cov==5.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["flowdoc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
