<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FlowDoc</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F4F6F9; --surface:#FFFFFF; --ink:#16202E; --muted:#5C6880; --faint:#8B96A8;
    --border:#E4E8EF; --line:#D7DDE6;
    --accent:#5B4BD6; --accent-soft:#ECEAFB; --accent-ink:#3A2EA8;
    --tx:#9A5B00; --tx-bg:#FBEFD6; --tx-line:#E6B25C;
    --sem:#B0303F; --sem-bg:#FBE2E5;
    --async:#0E7C6B; --async-bg:#DAF1EC;
    --ext:#1E5FA8; --ext-bg:#E4EDFA;
    --cls:#2A6F97; --mth:#5B4BD6; --type:#7C6A4A;
    --radius:12px;
    --mono:'JetBrains Mono',ui-monospace,monospace;
    --sans:'Inter',system-ui,sans-serif;
    --display:'Space Grotesk',var(--sans);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
    font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}

  .app{display:flex;align-items:flex-start;min-height:100vh}

  /* ---- sidebar ---- */
  .sidebar{width:296px;flex:none;position:sticky;top:0;height:100vh;overflow-y:auto;
    background:var(--surface);border-right:1px solid var(--border);padding:22px 18px;
    display:flex;flex-direction:column;gap:20px}
  .wordmark{font-family:var(--display);font-weight:700;font-size:21px;letter-spacing:-.02em;
    display:flex;align-items:center;gap:9px}
  .wordmark .glyph{display:inline-grid;place-items:center;width:29px;height:29px;border-radius:8px;
    background:var(--accent);color:#fff;font-size:15px}
  .wordmark .tag{font-family:var(--sans);font-weight:500;font-size:12px;color:var(--muted);margin-left:auto}

  .sb-section-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;
    color:var(--faint);margin:0 0 9px}

  .specbox{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:12px 13px;
    font-size:12.5px;color:var(--muted)}
  .specbox .src-meta{font-family:var(--mono);font-size:11.5px;color:var(--ink);margin-bottom:4px;word-break:break-all}
  .specbox .counts{font-family:var(--mono);font-size:11px;color:var(--faint)}
  .specbox button{margin-top:10px;font-family:var(--sans);font-size:12px;font-weight:500;
    background:var(--accent-soft);color:var(--accent-ink);border:none;border-radius:7px;
    padding:6px 11px;cursor:pointer}
  .specbox button:hover{background:#e0ddf7}

  .seq-list{display:flex;flex-direction:column;gap:5px}
  .seq-item{all:unset;display:block;cursor:pointer;border:1px solid var(--border);border-radius:9px;
    padding:10px 12px;transition:border-color .12s,background .12s}
  .seq-item:hover{border-color:var(--line);background:var(--bg)}
  .seq-item.active{border-color:var(--accent);background:var(--accent-soft)}
  .seq-item .stag{font-family:var(--mono);font-size:12.5px;color:var(--accent-ink);font-weight:500}
  .seq-item .sentry{font-family:var(--mono);font-size:11px;color:var(--faint);margin-top:3px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .seq-item.active .sentry{color:var(--muted)}

  .legend{display:flex;flex-direction:column;gap:7px}
  .legend .chip{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;
    font-weight:500;font-family:var(--mono);color:var(--muted)}
  .legend .sw{width:9px;height:9px;border-radius:3px;flex:none}
  .sw.tx{background:var(--tx-line)} .sw.sem{background:var(--sem)}
  .sw.async{background:var(--async)} .sw.ext{background:var(--ext)}

  /* ---- main ---- */
  .main{flex:1;min-width:0;max-width:900px;margin:0 auto;padding:30px 30px 80px}
  .seq-head{border-bottom:1px solid var(--border);padding-bottom:18px;margin-bottom:22px}
  .seq-route{display:inline-flex;align-items:center;gap:9px;margin-bottom:11px}
  .seq-route .verb{font-family:var(--mono);font-size:12px;font-weight:500;color:var(--ink)}
  .seq-route .pill{font-family:var(--mono);font-size:12px;background:var(--accent-soft);
    color:var(--accent-ink);padding:4px 10px;border-radius:999px;font-weight:500}
  .seq-title{font-family:var(--display);font-weight:600;font-size:20px;margin:0 0 5px}
  .seq-desc{color:var(--muted);margin:0;font-size:14px}

  /* ---- flow tree (from prototype) ---- */
  .flow{display:flex;flex-direction:column;gap:8px}
  .node{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    overflow:hidden;transition:border-color .15s}
  .node:hover{border-color:var(--line)}
  .node.open{border-color:var(--accent)}
  .node-head{all:unset;display:flex;align-items:center;gap:12px;width:100%;
    padding:14px 16px;cursor:pointer;box-sizing:border-box}
  .node-head:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;border-radius:var(--radius)}
  .chev{color:var(--faint);font-size:13px;transition:transform .18s;flex:none;width:12px}
  .node.open .chev{transform:rotate(90deg);color:var(--accent)}
  .node.leaf .chev{visibility:hidden}
  .sig{font-family:var(--mono);font-size:13px;font-weight:400;flex:1;min-width:0;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sig .cls{color:var(--cls);font-weight:500}
  .sig .mth{color:var(--mth);font-weight:700}
  .sig .type{color:var(--type)}
  .sig .pn{color:var(--ink)}
  .sig .pun{color:var(--faint)}
  .badges{display:flex;gap:6px;flex:none}
  .badge{font-family:var(--mono);font-size:11px;font-weight:500;padding:3px 8px;border-radius:6px;white-space:nowrap}
  .b-route{background:var(--accent-soft);color:var(--accent-ink)}
  .b-tx{background:var(--tx-bg);color:var(--tx)}
  .b-sem{background:var(--sem-bg);color:var(--sem)}
  .b-async{background:var(--async-bg);color:var(--async)}
  .b-ext{background:var(--ext-bg);color:var(--ext)}
  .b-repo{background:#EEF0F3;color:#56627A}
  .b-cycle{background:#F0ECFB;color:var(--accent-ink)}
  .b-write{background:#E8F1EA;color:#2E7D46}
  .b-warn{background:var(--sem-bg);color:var(--sem);font-weight:600}
  .b-trace{background:var(--accent);color:#fff;font-weight:600}

  /* ---- runtime trace overlay ---- */
  /* observed = actually executed; unobs = ran but AOP can't see (repo/external/self-call);
     nottaken = instrumentable but the request didn't go there. */
  .node.traveled{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
  .flow.has-trace .node.nottaken{opacity:.35}
  .flow.has-trace .node.unobs{opacity:1;border-style:dashed}
  .b-unobs{background:#EEF0F3;color:#56627A}
  .b-err{background:var(--sem);color:#fff}
  .sw.tr{background:var(--accent)} .sw.unobs{background:#9AA3B2} .sw.skip{background:#CDD3DC}
  .sw.err{background:var(--sem)}
  /* the failure frame: deepest OBSERVED span the exception passed through */
  .node.errnode{border-color:var(--sem);box-shadow:inset 3px 0 0 var(--sem)}
  .flow.has-trace .node.errnode{opacity:1}
  .err-strip{font-family:var(--mono);font-size:11.5px;color:var(--sem);background:var(--sem-bg);
    padding:8px 16px 8px 40px;border-top:1px solid #F0CdD2;line-height:1.5}
  .err-strip .where{color:var(--muted)}
  .trace-item .stag{color:var(--accent-ink)}
  .trace-item.active{border-color:var(--accent);background:var(--accent-soft)}
  .trace-meta{font-family:var(--mono);font-size:10.5px;color:var(--faint);margin-top:3px}
  .trace-actions{display:flex;gap:6px;margin-top:8px}
  .trace-actions button{flex:1;font-family:var(--sans);font-size:11.5px;font-weight:500;
    background:var(--bg);color:var(--muted);border:1px solid var(--border);border-radius:7px;
    padding:6px 8px;cursor:pointer}
  .trace-actions button:hover{border-color:var(--line)}

  /* ---- sequence lens (0002) ---- */
  .lens-toggle{display:inline-flex;gap:0;margin-top:14px;border:1px solid var(--border);
    border-radius:8px;overflow:hidden;background:var(--bg)}
  .lens-toggle button{font-family:var(--sans);font-size:12.5px;font-weight:500;color:var(--muted);
    background:transparent;border:0;padding:7px 16px;cursor:pointer}
  .lens-toggle button.active{background:var(--accent);color:#fff}
  .seq-legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;
    font-family:var(--mono);font-size:11px;color:var(--muted)}
  .seq-legend span::before{content:"";display:inline-block;width:16px;height:0;vertical-align:middle;
    margin-right:5px}
  .seq-legend .l-obs::before{border-top:2px solid var(--accent)}
  .seq-legend .l-async::before{border-top:2px dashed var(--async)}
  .seq-legend .l-unobs::before{border-top:2px dashed #9AA3B2}
  .seq-legend .l-err::before{border-top:2px solid var(--sem)}
  .seqwrap{overflow-x:auto;padding:8px 4px 4px}
  .seqsvg{display:block}
  .seqsvg .lifeline{stroke:var(--line);stroke-width:1;stroke-dasharray:3 4}
  .seqsvg .phead rect{fill:var(--surface);stroke:var(--border);stroke-width:1}
  .seqsvg .phead text{font-family:var(--sans);font-size:12.5px;font-weight:600;fill:var(--ink)}
  .seqsvg .phead.actor rect{fill:var(--accent-soft);stroke:var(--accent-soft)}
  .seqsvg .phead.actor text{fill:var(--accent-ink)}
  .seqsvg .act{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1}
  .seqsvg .act.err{fill:var(--sem-bg);stroke:var(--sem)}
  .seqsvg .msg{stroke:var(--accent);stroke-width:1.5}
  .seqsvg .msg.ret{stroke:var(--muted);stroke-width:1;stroke-dasharray:4 4}
  .seqsvg .msg.async{stroke:var(--async);stroke-dasharray:5 4}
  .seqsvg .msg.err{stroke:var(--sem);stroke-width:1.5;stroke-dasharray:0}
  .seqsvg .msg.unobs{stroke:#9AA3B2;stroke-width:1.3;stroke-dasharray:5 4}
  .seqsvg .msg.uret{stroke:#C3C9D4;stroke-width:1;stroke-dasharray:3 4}
  .seqsvg .act.unobs{fill:#F1F3F6;stroke:#B9C0CC}
  .seqsvg .mlabel{font-family:var(--mono);font-size:11.5px;fill:var(--ink)}
  .seqsvg .mlabel.err{fill:var(--sem);font-weight:600}
  .seqsvg .mlabel.unobs{fill:#56627A}
  .seq-empty{font-family:var(--mono);font-size:12px;color:var(--muted);padding:20px 4px}

  .tx-group{position:relative;margin-left:22px;padding-left:20px;
    border-left:2px solid var(--tx-line);display:flex;flex-direction:column;gap:8px;
    padding-top:4px;padding-bottom:4px;margin-top:8px}
  .tx-label{position:absolute;left:-2px;font-family:var(--mono);font-size:10.5px;
    background:var(--tx-bg);color:var(--tx);padding:2px 8px;border-radius:5px;font-weight:500}
  .tx-label.begin{top:-9px}
  .tx-label.commit{bottom:-9px}
  .child{margin-left:22px;border-left:2px solid var(--line);padding-left:20px;
    display:flex;flex-direction:column;gap:8px;margin-top:8px}
  .child.async-out{border-left-style:dashed;border-color:var(--async)}

  .node-body{display:none;padding:0 16px 16px 40px;border-top:1px solid var(--border)}
  .node.open .node-body{display:block}
  .loc{font-family:var(--mono);font-size:12px;color:var(--faint);margin:12px 0 16px}
  .loc::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;
    background:var(--accent);margin-right:8px;vertical-align:middle}
  .field{margin:0 0 16px}
  .field-label{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;
    text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:0 0 8px}
  .src{font-family:var(--mono);font-size:10px;font-weight:500;padding:2px 7px;border-radius:5px;
    text-transform:none;letter-spacing:0}
  .src.auto{background:#EEF0F3;color:#56627A}
  .src.doc{background:var(--accent-soft);color:var(--accent-ink)}
  .params{display:flex;flex-direction:column;gap:8px}
  .param-row{display:grid;grid-template-columns:1fr;gap:4px 14px;align-items:baseline;
    padding:9px 12px;background:var(--bg);border-radius:8px}
  .param-sig{font-family:var(--mono);font-size:12.5px}
  .param-sig .pn{color:var(--ink);font-weight:500}
  .param-sig .type{color:var(--type)}
  .param-note{color:var(--muted);font-size:13px}
  .ret{font-family:var(--mono);font-size:12.5px;padding:9px 12px;background:var(--bg);border-radius:8px}
  .ret .type{color:var(--type)}
  .anns{display:flex;gap:6px;flex-wrap:wrap}
  .ann{font-family:var(--mono);font-size:12px;padding:5px 10px;border-radius:7px;
    background:var(--bg);border:1px solid var(--border);color:var(--ink)}
  .ann.tx{border-color:var(--tx-line);color:var(--tx);background:var(--tx-bg)}
  .ann.sem{border-color:#E79BA5;color:var(--sem);background:var(--sem-bg)}
  .ann.async{border-color:#8FD3C7;color:var(--async);background:var(--async-bg)}
  .desc{color:var(--ink);font-size:14px;line-height:1.7;margin:0;
    padding:12px 14px;background:var(--accent-soft);border-radius:8px}

  /* ---- empty state ---- */
  .empty{max-width:560px;margin:12vh auto 0;text-align:center;padding:0 20px}
  .empty .glyph{display:inline-grid;place-items:center;width:54px;height:54px;border-radius:14px;
    background:var(--accent);color:#fff;font-size:26px;font-family:var(--display);margin-bottom:18px}
  .empty h1{font-family:var(--display);font-weight:600;font-size:23px;margin:0 0 8px}
  .empty p{color:var(--muted);margin:0 0 22px}
  .dropzone{border:2px dashed var(--line);border-radius:14px;padding:34px 22px;background:var(--surface);
    transition:border-color .15s,background .15s;cursor:pointer}
  .dropzone.drag{border-color:var(--accent);background:var(--accent-soft)}
  .dropzone b{color:var(--accent-ink)}
  .empty .hint{font-family:var(--mono);font-size:12px;color:var(--faint);margin-top:18px;line-height:1.9;text-align:left;
    background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 16px}
  .empty .hint .c{color:var(--ink)}

  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
  @media (max-width:820px){
    .app{flex-direction:column}
    .sidebar{width:100%;height:auto;position:static;border-right:none;border-bottom:1px solid var(--border)}
    .badges{display:none}
    .main{padding:22px 16px 60px}
  }
</style>
</head>
<body>
<div class="app" id="app"><!-- rendered by JS --></div>

<input type="file" id="filein" accept=".json,application/json" hidden>

<script>
"use strict";

const MAX_DEPTH = 30;

const VERB = {
  GetMapping:"GET", PostMapping:"POST", PutMapping:"PUT",
  DeleteMapping:"DELETE", PatchMapping:"PATCH", RequestMapping:"REQ"
};
const ENTRY_ANNS = new Set([...Object.keys(VERB),
  "KafkaListener","RabbitListener","JmsListener","EventListener","Scheduled","MessageMapping"]);

const state = { spec:null, nodesById:{}, adjacency:{}, guardsById:{}, seqIndex:0,
  // runtime overlay (v0.3): recorded traces + the currently replayed one
  traces:[], traceIndex:null, traveledNodes:null, traceTiming:null, traceError:null,
  // sequence lens (0002): "tree" call hierarchy | "sequence" from the selected trace
  lens:"tree" };

/* ---------------- loading ---------------- */

function indexSpec(spec){
  const nodesById = {};
  (spec.nodes||[]).forEach(n => nodesById[n.id] = n);
  const adjacency = {};
  (spec.edges||[]).forEach(e => { (adjacency[e.from] ||= []).push(e); });
  const guardsById = {};
  (spec.guards||[]).forEach(g => guardsById[g.nodeId] = g);
  state.spec = spec; state.nodesById = nodesById;
  state.adjacency = adjacency; state.guardsById = guardsById; state.seqIndex = 0;
  // A freshly indexed spec drops any active trace replay (the node ids may differ).
  state.traceIndex = null; state.traveledNodes = null; state.traceTiming = null;
  state.traceError = null;
}

function loadSpec(spec){
  indexSpec(spec);
  // Default to the first author-declared (@FlowEntry) flow; fall back to the first overall.
  const seqs = spec.sequences || [];
  const firstDeclared = seqs.findIndex(s => s.source !== "auto");
  state.seqIndex = firstDeclared >= 0 ? firstDeclared : 0;
  render();
}

async function tryAutoLoad(){
  const url = new URLSearchParams(location.search).get("spec") || "./flowdoc.json";
  try{
    const res = await fetch(url, {cache:"no-store"});
    if(!res.ok) throw new Error(res.status);
    indexSpec(await res.json());
    await loadTraces();           // best-effort runtime overlay; ok if absent
    loadSpec(state.spec);
  }catch(e){
    renderEmpty();
  }
}

// Runtime overlay: the live starter serves recorded traces beside the spec.
// Loading a spec from a file leaves this empty — the structure view stands alone.
async function loadTraces(){
  try{
    const res = await fetch("./traces.json", {cache:"no-store"});
    if(!res.ok) throw new Error(res.status);
    const traces = await res.json();
    state.traces = Array.isArray(traces) ? traces : [];
  }catch(e){
    state.traces = [];
  }
}

function selectTrace(i){
  const t = state.traces[i];
  if(!t){ clearTrace(); return; }
  state.traceIndex = i;
  state.traveledNodes = new Set(t.spans.map(s => s.nodeId));
  // Sum observed duration per node (a node may recur across spans).
  const timing = {};
  for(const s of t.spans){
    if(s.tEnter != null && s.tExit != null){
      timing[s.nodeId] = (timing[s.nodeId] || 0) + (s.tExit - s.tEnter);
    }
  }
  state.traceTiming = timing;
  // Localize the failure: errorSpanId points at the deepest observed span the
  // exception passed through; map it back to its node to highlight on the graph.
  state.traceError = null;
  if(t.error){
    const span = t.spans.find(s => s.id === t.errorSpanId);
    state.traceError = { nodeId: span ? span.nodeId : null, message: t.error };
  }
  // Focus the sequence this trace actually entered, if one matches.
  const si = (state.spec.sequences||[]).findIndex(s => s.entry === t.sequenceTag);
  if(si >= 0) state.seqIndex = si;
  render();
}

function clearTrace(){
  state.traceIndex = null; state.traveledNodes = null; state.traceTiming = null;
  state.traceError = null;
  render();
}

async function refreshTraces(){
  await loadTraces();
  if(state.traceIndex != null && state.traceIndex >= state.traces.length) clearTrace();
  else render();
}

function loadFromFile(file){
  const reader = new FileReader();
  reader.onload = () => {
    try{ state.traces = []; loadSpec(JSON.parse(reader.result)); }
    catch(err){ alert("flowdoc.json 파싱 실패: " + err.message); }
  };
  reader.readAsText(file);
}

/* ---------------- helpers ---------------- */

const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const unquote = s => (typeof s==="string" && s.length>=2 && s[0]==='"' && s.endsWith('"')) ? s.slice(1,-1) : s;

function annByName(node, name){
  return (node.auto?.annotations||[]).find(a => a.name === name);
}
function isTransactional(node){
  return !!(node.markers?.transaction) || !!annByName(node,"Transactional");
}
function isAsync(node){ return !!annByName(node,"Async"); }
function routeOf(node){
  for(const a of (node.auto?.annotations||[])){
    if(VERB[a.name]){
      const path = a.attributes ? unquote(a.attributes.value || a.attributes.path || "") : "";
      return { verb: VERB[a.name], path };
    }
  }
  return null;
}

/* ---- trace overlay classification (3 states) ---- */
const idOwner = id => (id||"").split("#")[0];

// External boundaries the AOP agent never advises — a miss here means "not observable",
// not "not executed". The static scanner already marks these.
function isUnobservable(node){
  return node.kind === "external"
    || !!annByName(node,"Repository")
    || !!annByName(node,"FlowExternal");
}

// "" (no trace) | traveled (observed) | unobs (ran but invisible) | nottaken (real miss)
// `inherited` carries the parent's verdict down: once we lose sight of a frame, every
// node beneath it is also unobservable — we can't claim its callees ran or didn't.
function traceClass(node, parentNode, inherited){
  if(!state.traveledNodes) return "";
  if(state.traveledNodes.has(node.id)) return "traveled";
  if(inherited) return inherited;            // below a blind (unobs) or skipped frame
  if(isUnobservable(node)) return "unobs";
  // self-invocation: an observed caller into its own class — Spring AOP can't see it.
  if(parentNode && state.traveledNodes.has(parentNode.id)
     && idOwner(node.id) === idOwner(parentNode.id)) return "unobs";
  return "nottaken";
}

/* ---------------- tree ---------------- */

function buildTree(entryId){
  const onPath = new Set();
  function visit(id, depth){
    const node = state.nodesById[id];
    if(!node) return null;                       // external / unresolved — not a drawn node
    const tn = { id, depth, cyclic:false, capped:false, children:[] };
    if(onPath.has(id)){ tn.cyclic = true; return tn; }
    if(depth >= MAX_DEPTH){ tn.capped = true; return tn; }
    onPath.add(id);
    for(const e of (state.adjacency[id]||[])){
      const child = visit(e.to, depth+1);
      if(child){ child.edge = e; tn.children.push(child); }
    }
    onPath.delete(id);
    return tn;
  }
  return visit(entryId, 0);
}

/* ---------------- rendering: signature & badges ---------------- */

function renderSig(node){
  const owner = node.owner || (node.id.split("#")[0].split(".").pop());
  const name = node.simpleName || (node.id.split("#")[1]||"").split("(")[0];
  const params = (node.auto?.params||[])
    .map(p => `<span class="pn">${esc(p.name)}</span><span class="pun">: </span><span class="type">${esc(p.type)}</span>`)
    .join('<span class="pun">, </span>');
  const ret = node.auto?.returns?.type
    ? `<span class="pun">): </span><span class="type">${esc(node.auto.returns.type)}</span>`
    : `<span class="pun">)</span>`;
  return `<span class="cls">${esc(owner)}</span><span class="pun">.</span>`
       + `<span class="mth">${esc(name)}</span><span class="pun">(</span>${params}${ret}`;
}

function badgesFor(node, tn, isEntry, inTx){
  const out = [];
  const r = routeOf(node);
  if(r) out.push(`<span class="badge b-route">${esc(r.verb)}${r.path ? " "+esc(r.path) : ""}</span>`);
  if(isEntry && annByName(node,"FlowEntry"))
    out.push(`<span class="badge b-route">@FlowEntry</span>`);
  if(isTransactional(node)) out.push(`<span class="badge b-tx">@Transactional</span>`);
  if(state.guardsById[node.id]) out.push(`<span class="badge b-sem">@Guarded</span>`);
  if(isAsync(node)) out.push(`<span class="badge b-async">@Async</span>`);
  if(annByName(node,"FlowExternal")) out.push(`<span class="badge b-ext">external</span>`);
  if(annByName(node,"Repository")) out.push(`<span class="badge b-repo">@Repository</span>`);
  const da = node.markers && node.markers.dataAccess;
  if(da === "write") out.push(inTx
    ? `<span class="badge b-write">쓰기</span>`
    : `<span class="badge b-warn">⚠ tx-외 쓰기</span>`);
  if(tn && tn.cyclic) out.push(`<span class="badge b-cycle">↻ 순환</span>`);
  if(state.traveledNodes && state.traveledNodes.has(node.id)){
    const ms = state.traceTiming ? state.traceTiming[node.id] : null;
    out.push(`<span class="badge b-trace">▶${ms!=null ? " "+ms+"ms" : " 탔음"}</span>`);
  }
  return out.join("");
}

/* ---------------- rendering: detail body ---------------- */

function annClass(name){
  if(name==="Transactional") return " tx";
  if(name==="Guarded") return " sem";
  if(name==="Async") return " async";
  return "";
}
function annText(a){
  if(!a.attributes || !Object.keys(a.attributes).length) return "@"+a.name;
  const inner = Object.entries(a.attributes)
    .map(([k,v]) => k==="value" ? unquote(v) : `${k} = ${unquote(v)}`)
    .join(", ");
  return `@${a.name}(${inner})`;
}

function renderBody(node){
  const loc = node.location
    ? `${node.location.file||"?"}${node.location.line ? ":"+node.location.line : ""}`
    : node.id;
  let html = `<div class="node-body"><div class="loc">${esc(loc)}</div>`;

  const params = node.auto?.params || [];
  if(params.length){
    html += `<div class="field"><div class="field-label">파라미터 <span class="src auto">auto</span></div><div class="params">`;
    for(const p of params){
      const doc = node.declared?.paramDocs?.[p.name];
      html += `<div class="param-row"><span class="param-sig"><span class="pn">${esc(p.name)}</span>: <span class="type">${esc(p.type)}</span></span>`;
      if(doc) html += `<span class="param-note">${esc(doc)}</span>`;
      html += `</div>`;
    }
    html += `</div></div>`;
  }

  if(node.auto?.returns?.type){
    html += `<div class="field"><div class="field-label">리턴 <span class="src auto">auto</span></div>`
         +  `<div class="ret"><span class="type">${esc(node.auto.returns.type)}</span></div></div>`;
  }

  const anns = node.auto?.annotations || [];
  if(anns.length){
    html += `<div class="field"><div class="field-label">어노테이션 <span class="src auto">auto</span></div><div class="anns">`;
    html += anns.map(a => `<span class="ann${annClass(a.name)}">${esc(annText(a))}</span>`).join("");
    html += `</div></div>`;
  }

  if(node.declared?.description){
    html += `<div class="field"><div class="field-label">설명 <span class="src doc">doc</span></div>`
         +  `<p class="desc">${esc(node.declared.description)}</p></div>`;
  }

  html += `</div>`;
  return html;
}

/* ---------------- rendering: node + children ---------------- */

function renderTreeNode(tn, isEntry, inTx, inherited){
  const node = state.nodesById[tn.id];
  const badges = badgesFor(node, tn, isEntry, inTx);
  const leaf = tn.children.length === 0;
  const parentNode = tn.edge ? state.nodesById[tn.edge.from] : null;
  const tcls = traceClass(node, parentNode, inherited);
  const traceBadge = tcls === "unobs" ? `<span class="badge b-unobs">관측 밖</span>` : "";
  // Observed frames let children be judged fresh; anything else blinds its subtree.
  const childInherited = (tcls === "" || tcls === "traveled") ? "" : tcls;

  // Failure frame: deepest observed span the exception passed through.
  const isErr = state.traceError && state.traceError.nodeId === tn.id;
  const errBadge = isErr ? `<span class="badge b-err">⚠ 실패 지점</span>` : "";
  // If the throw is actually below this frame, that subtree is unobserved.
  const deeperBlind = isErr && tn.children.some(c =>
    traceClass(state.nodesById[c.id], node, childInherited) === "unobs");
  const errStrip = isErr
    ? `<div class="err-strip">⚠ ${esc(state.traceError.message)}`
      + `<br><span class="where">관측된 가장 깊은 실패 프레임`
      + (deeperBlind ? " — 실제 throw는 이 아래 관측 밖일 수 있음" : "") + `</span></div>`
    : "";

  let html = `<div class="node${leaf ? " leaf":""}${tcls ? " "+tcls : ""}${isErr ? " errnode":""}">`
    + `<button class="node-head" aria-expanded="false"><span class="chev">›</span>`
    + `<span class="sig">${renderSig(node)}</span>`
    + `<span class="badges">${errBadge}${badges}${traceBadge}</span></button>`
    + errStrip
    + renderBody(node)
    + `</div>`;

  if(tn.children.length){
    if(isTransactional(node)){
      const asyncKids = tn.children.filter(c => isAsync(state.nodesById[c.id]));
      const txKids    = tn.children.filter(c => !isAsync(state.nodesById[c.id]));
      if(txKids.length){
        html += `<div class="tx-group"><span class="tx-label begin">tx begin</span>`
              + txKids.map(c => renderTreeNode(c,false,true,childInherited)).join("")
              + `<span class="tx-label commit">commit</span></div>`;
      }
      if(asyncKids.length){               // async post-commit lives OUTSIDE the rail
        html += `<div class="child async-out">`
              + asyncKids.map(c => renderTreeNode(c,false,false,childInherited)).join("") + `</div>`;
      }
    } else {
      html += `<div class="child">`
            + tn.children.map(c => renderTreeNode(c,false,inTx,childInherited)).join("") + `</div>`;
    }
  }
  return html;
}

/* ---------------- sequence lens (0002) ---------------- */
// A recorded trace already carries sequence-diagram data: spans give order (tEnter),
// caller (parent), participant (nodeId owner) and thread. We render it directly — an
// execution-verified, always-fresh sequence diagram — keeping the overlay's honesty:
// unobserved calls (repo/external/self) have no span, so we never draw them as real
// arrows; we mark them with a "관측 밖" note instead.

const spanSeqNo = id => parseInt(String(id).replace(/^s/, ""), 10) || 0;

// Participant name for a span: the scanner's short owner when the node is known.
function spanOwner(nodeId){
  const n = state.nodesById[nodeId];
  if(n && n.owner) return n.owner;
  const fqn = idOwner(nodeId);
  return fqn.split(".").pop() || fqn;
}
// "method(Type,Type)" message label, straight from the node id (already simplified).
function spanSig(nodeId){ return (nodeId.split("#")[1]) || nodeId; }

// Calls this frame makes that the agent can't observe (repo/external/self-invocation):
// they have no runtime span, but the static graph knows the edge. We draw them as
// dashed "관측 밖" messages — visually distinct from observed (solid) calls, so we
// surface the call without claiming we saw it run.
function unobservedCalls(nodeId){
  const out = [], seen = new Set();
  for(const e of (state.adjacency[nodeId] || [])){
    const child = state.nodesById[e.to];
    const selfCall = idOwner(e.to) === idOwner(nodeId);
    if(!child || isUnobservable(child) || selfCall){
      const owner = spanOwner(e.to), label = spanSig(e.to);
      const key = owner + "|" + label;
      if(!seen.has(key)){ seen.add(key); out.push({ owner, label, self: selfCall }); }
    }
  }
  return out;
}

function spanForest(spans){
  const byId = {}; spans.forEach(s => byId[s.id] = s);
  const kids = {}; const roots = [];
  spans.slice().sort((a,b) => spanSeqNo(a.id) - spanSeqNo(b.id)).forEach(s => {
    if(s.parent && byId[s.parent]) (kids[s.parent] = kids[s.parent] || []).push(s);
    else roots.push(s);
  });
  Object.values(kids).forEach(a => a.sort((x,y) => spanSeqNo(x.id) - spanSeqNo(y.id)));
  return { byId, kids, roots };
}

function renderSequence(trace){
  const spans = (trace && trace.spans) || [];
  if(!spans.length) return `<div class="seq-empty">이 트레이스에 span이 없습니다.</div>`;
  const { byId, kids, roots } = spanForest(spans);

  // Exception path: the error span and its ancestors, drawn with --x returns.
  const errorPath = new Set();
  if(trace.errorSpanId){
    let cur = byId[trace.errorSpanId];
    while(cur){ errorPath.add(cur.id); cur = cur.parent ? byId[cur.parent] : null; }
  }

  const participants = ["요청"];
  const pIndex = { "요청": 0 };
  const addOwner = o => { if(!(o in pIndex)){ pIndex[o] = participants.length; participants.push(o); } };
  const rootThread = roots[0] && roots[0].thread;

  const rows = [];   // {kind:'call'|'return'|'ucall'|'uret'|'uself', ...}
  const acts = [];   // observed activation bars {p,y0,y1,err}
  const uacts = [];  // unobserved (관측 밖) activation bars {p,y0,y1}
  function walk(span, callerIdx){
    const owner = spanOwner(span.nodeId);
    addOwner(owner);
    const to = pIndex[owner];
    const async = !!(span.thread && rootThread && span.thread !== rootThread);
    const err = errorPath.has(span.id);
    const y0 = rows.length;
    rows.push({ kind:"call", from:callerIdx, to, label:spanSig(span.nodeId), err, async });
    (kids[span.id] || []).forEach(c => walk(c, to));
    // Unobserved calls this frame makes — drawn dashed/grey (no runtime span, static edge).
    for(const uc of unobservedCalls(span.nodeId)){
      addOwner(uc.owner);
      const uto = pIndex[uc.owner];
      if(uto === to){                         // self-invocation: a self-loop on this lifeline
        rows.push({ kind:"uself", p:to, label:uc.label });
      } else {
        const uy0 = rows.length;
        rows.push({ kind:"ucall", from:to, to:uto, label:uc.label });
        rows.push({ kind:"uret", from:uto, to });
        uacts.push({ p:uto, y0:uy0, y1:rows.length });
      }
    }
    const y1 = rows.length;
    rows.push({ kind:"return", from:to, to:callerIdx, err, async });
    acts.push({ p:to, y0, y1, err });
  }
  roots.forEach(r => walk(r, 0));

  const COL = 178, PADX = 26, HEAD = 58, ROW = 30, TOP = HEAD + 16;
  const laneX = i => PADX + i * COL + COL / 2;
  const W = PADX * 2 + participants.length * COL;
  const H = TOP + rows.length * ROW + 24;
  const rowY = r => TOP + r * ROW + ROW / 2;

  let s = `<svg class="seqsvg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="sequence diagram">`;
  s += `<defs>`
    + `<marker id="ah" markerWidth="10" markerHeight="8" refX="7.5" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="var(--accent)"/></marker>`
    + `<marker id="ahx" markerWidth="10" markerHeight="8" refX="7.5" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="var(--sem)"/></marker>`
    + `<marker id="aha" markerWidth="10" markerHeight="8" refX="7.5" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="var(--async)"/></marker>`
    + `<marker id="ahu" markerWidth="10" markerHeight="8" refX="7.5" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#9AA3B2"/></marker>`
    + `</defs>`;

  participants.forEach((p,i) => {
    const x = laneX(i);
    s += `<line class="lifeline" x1="${x}" y1="${HEAD}" x2="${x}" y2="${H-8}"/>`;
    s += `<g class="phead${i===0 ? " actor" : ""}"><rect x="${x-COL/2+14}" y="14" width="${COL-28}" height="32" rx="8"/>`
       + `<text x="${x}" y="35" text-anchor="middle">${esc(p)}</text></g>`;
  });

  uacts.forEach(a => {
    const x = laneX(a.p), y0 = rowY(a.y0), y1 = rowY(a.y1);
    s += `<rect class="act unobs" x="${x-5}" y="${y0}" width="10" height="${Math.max(7, y1-y0)}" rx="2"/>`;
  });
  acts.forEach(a => {
    const x = laneX(a.p), y0 = rowY(a.y0), y1 = rowY(a.y1);
    s += `<rect class="act${a.err ? " err" : ""}" x="${x-5}" y="${y0}" width="10" height="${Math.max(7, y1-y0)}" rx="2"/>`;
  });

  rows.forEach((r, idx) => {
    const y = rowY(idx);
    // Self-invocation the agent can't see: a small dashed loop on its own lifeline.
    if(r.kind === "uself"){
      const x = laneX(r.p);
      s += `<path class="msg unobs" d="M${x+5},${y-5} h20 v10 h-14" fill="none" marker-end="url(#ahu)"/>`
         + `<text class="mlabel unobs" x="${x+30}" y="${y-1}">${esc(r.label)}</text>`;
      return;
    }
    if(r.kind === "return" && r.async) return;    // async is fire-and-forget: no return arrow
    if(r.kind === "uret") {                         // dashed grey return, no label
      const a1 = laneX(r.from), a2 = laneX(r.to), d = a2 > a1 ? 1 : -1;
      s += `<line class="msg uret" x1="${a1 - d*5}" y1="${y}" x2="${a2 + d*5}" y2="${y}"/>`;
      return;
    }
    const x1 = laneX(r.from), x2 = laneX(r.to);
    if(x1 === x2) return;
    const dir = x2 > x1 ? 1 : -1;
    let cls, marker;
    if(r.kind === "ucall"){ cls = "msg unobs"; marker = "ahu"; }
    else if(r.kind === "call"){ cls = "msg call" + (r.err ? " err" : r.async ? " async" : ""); marker = r.err ? "ahx" : r.async ? "aha" : "ah"; }
    else { cls = "msg ret" + (r.err ? " err" : ""); marker = r.err ? "ahx" : "ah"; }
    s += `<line class="${cls}" x1="${x1 + dir*5}" y1="${y}" x2="${x2 - dir*5}" y2="${y}" marker-end="url(#${marker})"/>`;
    if(r.kind === "call" || r.kind === "ucall"){
      const lc = r.kind === "ucall" ? " unobs" : (r.err ? " err" : "");
      s += `<text class="mlabel${lc}" x="${(x1+x2)/2}" y="${y-6}" text-anchor="middle">${esc(r.label)}</text>`;
    } else if(r.err && r.to === 0){
      s += `<text class="mlabel err" x="${(x1+x2)/2}" y="${y-6}" text-anchor="middle">✕ ${esc(trace.error || "error")}</text>`;
    }
  });

  s += `</svg>`;
  const legend = `<div class="seq-legend">`
    + `<span class="l-obs">관측된 호출</span><span class="l-async">async (다른 스레드)</span>`
    + `<span class="l-unobs">관측 밖 (repo·external·self)</span>`
    + (trace.error ? `<span class="l-err">실패</span>` : "")
    + `</div>`;
  return legend + `<div class="seqwrap">${s}</div>`;
}

/* ---------------- rendering: shells ---------------- */

function render(){
  const spec = state.spec;
  const seqs = spec.sequences || [];
  const app = document.getElementById("app");

  if(!seqs.length){
    app.innerHTML = sidebarHtml(seqs) +
      `<main class="main"><div class="seq-head"><h1 class="seq-title">시퀀스가 없습니다</h1>`
      + `<p class="seq-desc">스펙에 <code>@FlowEntry</code> 진입점이 없어요. 노드 ${ (spec.nodes||[]).length }개는 로드됐습니다. `
      + `진입점 메서드에 <code>@FlowEntry("tag")</code> 를 달고 다시 스캔하세요.</p></div></main>`;
    wireUp();
    return;
  }

  const seq = seqs[Math.min(state.seqIndex, seqs.length-1)];
  const entryNode = state.nodesById[seq.entry];
  const tree = buildTree(seq.entry);

  // Header trigger badge from the language-neutral seq.trigger (kind drives display).
  const trig = seq.trigger;
  let routeInner = "";
  if(trig){
    if(trig.kind === "http"){
      const verb = (trig.detail && trig.detail.verb) || "HTTP";
      const path = (trig.detail && trig.detail.path) || "";
      routeInner = `<span class="verb">${esc(verb)}</span>` + (path ? `<span class="pill">${esc(path)}</span>` : "");
    } else {
      routeInner = `<span class="verb">${esc(trig.kind)}</span><span class="pill">${esc(trig.label||"")}</span>`;
    }
  }
  const routeHtml = `<div class="seq-route">${routeInner}<span class="pill">${esc(seq.tag)}</span></div>`;

  const title = seq.title || seq.tag;
  const desc = seq.description
    || "진입점에서 시작해 요청이 어떤 함수를 거쳐 나가는지. 행을 누르면 파라미터·리턴·어노테이션·설명이 펼쳐집니다.";

  const flowCls = state.traveledNodes ? "flow has-trace" : "flow";
  const flowHtml = entryNode
    ? `<div class="${flowCls}">${renderTreeNode(tree, true, false, "")}</div>`
    : `<p class="seq-desc">진입 노드 <code>${esc(seq.entry)}</code> 를 스펙에서 찾지 못했습니다.</p>`;

  // Sequence lens is trace-driven: only offered while a recorded trace is replayed.
  const hasTrace = state.traceIndex != null && state.traveledNodes;
  const lens = hasTrace ? state.lens : "tree";
  const lensToggle = hasTrace
    ? `<div class="lens-toggle">`
      + `<button data-lens="tree" class="${lens==="tree"?"active":""}">콜 트리</button>`
      + `<button data-lens="sequence" class="${lens==="sequence"?"active":""}">시퀀스</button></div>`
    : "";
  const bodyHtml = (lens === "sequence")
    ? renderSequence(state.traces[state.traceIndex])
    : flowHtml;

  app.innerHTML = sidebarHtml(seqs) +
    `<main class="main">`
    + `<div class="seq-head">${routeHtml}<h1 class="seq-title">${esc(title)}</h1>`
    + `<p class="seq-desc">${esc(desc)}</p>${lensToggle}</div>`
    + bodyHtml
    + `</main>`;
  wireUp();
}

function sidebarHtml(seqs){
  const spec = state.spec || {};
  const src = spec.source || {};
  const meta = [src.language, src.framework, src.collector].filter(Boolean).join(" · ");
  const counts = `${(spec.nodes||[]).length} nodes · ${(spec.edges||[]).length} edges · `
               + `${(spec.guards||[]).length} guards`;

  const seqItem = (s,i) => {
    const en = state.nodesById[s.entry];
    // Neutral trigger label ("GET /x", "Scheduled · cron", "Kafka · topic"); never a framework name.
    const sub = (s.trigger && s.trigger.label) || (en ? `${en.owner||""}.${en.simpleName||""}` : s.entry);
    return `<button class="seq-item${i===state.seqIndex?" active":""}" data-seq="${i}">`
         + `<div class="stag">${esc(s.tag)}</div><div class="sentry">${esc(sub)}</div></button>`;
  };
  // Preserve each sequence's ORIGINAL index (used by data-seq / state.seqIndex) when grouping.
  const idx = seqs.map((s,i) => [s,i]);
  const declared = idx.filter(([s]) => s.source !== "auto");
  const autoSeqs = idx.filter(([s]) => s.source === "auto");
  const listOf = arr => arr.map(([s,i]) => seqItem(s,i)).join("");
  const seqSection = (declared.length && autoSeqs.length)
    ? `<div class="sb-section-label">선언 @FlowEntry (${declared.length})</div>`
      + `<div class="seq-list">${listOf(declared)}</div>`
      + `<div class="sb-section-label" style="margin-top:16px">자동 감지 · 트리거 (${autoSeqs.length})</div>`
      + `<div class="seq-list">${listOf(autoSeqs)}</div>`
    : `<div class="sb-section-label">시퀀스 (${seqs.length})</div>`
      + `<div class="seq-list">${listOf(idx)||'<div class="specbox">없음</div>'}</div>`;

  return `<aside class="sidebar">`
    + `<div class="wordmark"><span class="glyph">↳</span>FlowDoc<span class="tag">v${esc(spec.flowdoc||"?")}</span></div>`
    + `<div><div class="sb-section-label">Spec</div>`
    + `<div class="specbox"><div class="src-meta">${esc(meta||"unknown")}</div>`
    + `<div class="counts">${esc(counts)}</div>`
    + `<button id="loadbtn">다른 flowdoc.json 열기</button></div></div>`
    + `<div>${seqSection}</div>`
    + `<div>${traceSectionHtml()}</div>`
    + `<div><div class="sb-section-label">범례</div><div class="legend">`
    + `<span class="chip"><span class="sw tx"></span>트랜잭션 경계</span>`
    + `<span class="chip"><span class="sw sem"></span>세마포어 가드</span>`
    + `<span class="chip"><span class="sw async"></span>비동기 후처리</span>`
    + `<span class="chip"><span class="sw ext"></span>외부 호출</span>`
    + `</div>`
    + ((state.traces||[]).length
        ? `<div class="sb-section-label" style="margin-top:14px">오버레이</div><div class="legend">`
          + `<span class="chip"><span class="sw tr"></span>탄 경로 (관측)</span>`
          + `<span class="chip"><span class="sw unobs"></span>관측 밖 (계측 한계)</span>`
          + `<span class="chip"><span class="sw skip"></span>안 탐</span>`
          + `<span class="chip"><span class="sw err"></span>실패 지점</span>`
          + `</div>`
        : "")
    + `</div></aside>`;
}

// Runtime overlay section: pick a recorded execution to replay over the tree.
function traceSectionHtml(){
  const traces = state.traces || [];
  const label = `<div class="sb-section-label">런타임 트레이스 (${traces.length})</div>`;
  if(!traces.length){
    return label + `<div class="specbox">라이브 <code>/flowdoc</code>에서 요청을 보내면 `
      + `실제 실행 경로가 여기 쌓입니다.<button id="trace-refresh">새로고침</button></div>`;
  }
  const shortTag = t => (t.sequenceTag||"").split("#")[1]?.split("(")[0] || t.sequenceTag || t.traceId;
  const totalMs = t => {
    const root = t.spans.find(s => s.parent == null) || t.spans[0];
    return (root && root.tEnter != null && root.tExit != null) ? (root.tExit - root.tEnter) : null;
  };
  // Prefer the entered sequence's trigger ("POST /x") so two calls to different
  // endpoints aren't both just "issue".
  const triggerLabel = t => {
    const seq = (state.spec.sequences||[]).find(s => s.entry === t.sequenceTag);
    const tr = seq && seq.trigger;
    if(tr){
      if(tr.kind === "http" && tr.detail) return `${tr.detail.verb||"HTTP"} ${tr.detail.path||""}`.trim();
      return tr.label || tr.kind;
    }
    return shortTag(t);
  };
  const items = traces.map((t,i) => {
    const ms = totalMs(t);
    const outcome = t.error
      ? `<span class="badge b-warn" title="${esc(t.error)}">⚠ 에러</span>`
      : `<span class="badge b-write">OK</span>`;
    const meta = `${t.spans.length} spans${ms!=null ? " · "+ms+"ms" : ""}`;
    return `<button class="seq-item trace-item${i===state.traceIndex?" active":""}" data-trace="${i}">`
         + `<div class="stag">▶ ${esc(triggerLabel(t))} ${outcome}</div>`
         + `<div class="trace-meta">${esc(meta)}</div></button>`;
  }).join("");
  return label + `<div class="seq-list">${items}</div>`
    + `<div class="trace-actions">`
    + `<button id="trace-clear"${state.traceIndex==null?" disabled":""}>구조만 보기</button>`
    + `<button id="trace-refresh">새로고침</button></div>`;
}

function renderEmpty(){
  const app = document.getElementById("app");
  app.innerHTML =
    `<div class="empty">`
    + `<div class="glyph">↳</div><h1>FlowDoc</h1>`
    + `<p>백엔드 내부 호출 흐름 뷰어. <code>flowdoc.json</code> 스펙을 불러오세요.</p>`
    + `<div class="dropzone" id="dz"><b>flowdoc.json</b> 을 여기로 끌어다 놓거나<br>클릭해서 파일 선택</div>`
    + `<div class="hint">스캐너로 스펙 생성:<br>`
    + `<span class="c">cd flowdoc-java</span><br>`
    + `<span class="c">./gradlew :flowdoc-scanner:run \\<br>&nbsp;&nbsp;--args="/경로/src/main/java /경로/flowdoc.json"</span><br><br>`
    + `또는 같은 폴더에 <span class="c">flowdoc.json</span> 을 두고 <span class="c">python3 -m http.server</span> 로 열기</div>`
    + `</div>`;
  const dz = document.getElementById("dz");
  dz.addEventListener("click", () => document.getElementById("filein").click());
}

/* ---------------- events ---------------- */

function wireUp(){
  document.querySelectorAll(".node-head").forEach(btn => {
    btn.addEventListener("click", () => {
      const node = btn.closest(".node");
      const open = node.classList.toggle("open");
      btn.setAttribute("aria-expanded", open ? "true" : "false");
    });
  });
  document.querySelectorAll(".seq-item").forEach(btn => {
    btn.addEventListener("click", () => {
      state.seqIndex = parseInt(btn.dataset.seq, 10);
      render();
    });
  });
  const lb = document.getElementById("loadbtn");
  if(lb) lb.addEventListener("click", () => document.getElementById("filein").click());
  document.querySelectorAll(".trace-item").forEach(btn => {
    btn.addEventListener("click", () => selectTrace(parseInt(btn.dataset.trace, 10)));
  });
  document.querySelectorAll(".lens-toggle button").forEach(btn => {
    btn.addEventListener("click", () => { state.lens = btn.dataset.lens; render(); });
  });
  const tc = document.getElementById("trace-clear");
  if(tc) tc.addEventListener("click", clearTrace);
  const tr = document.getElementById("trace-refresh");
  if(tr) tr.addEventListener("click", refreshTraces);
}

document.getElementById("filein").addEventListener("change", e => {
  if(e.target.files[0]) loadFromFile(e.target.files[0]);
});

// global drag & drop
window.addEventListener("dragover", e => { e.preventDefault();
  const dz = document.getElementById("dz"); if(dz) dz.classList.add("drag"); });
window.addEventListener("dragleave", () => {
  const dz = document.getElementById("dz"); if(dz) dz.classList.remove("drag"); });
window.addEventListener("drop", e => {
  e.preventDefault();
  const dz = document.getElementById("dz"); if(dz) dz.classList.remove("drag");
  if(e.dataTransfer.files[0]) loadFromFile(e.dataTransfer.files[0]);
});

tryAutoLoad();
</script>
